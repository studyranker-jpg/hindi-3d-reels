<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const stage=document.querySelector('#stage');
const scene=new THREE.Scene();
scene.background=new THREE.Color('#071326');
scene.fog=new THREE.Fog('#071326',8,25);

const camera=new THREE.PerspectiveCamera(45,9/16,.1,100);
camera.position.set(0,1.5,9);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(stage.clientWidth,stage.clientHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

const amb=new THREE.AmbientLight(0xffffff,1.4);
scene.add(amb);
const light=new THREE.PointLight(0x00aaff,45,20);
light.position.set(3,5,5);
scene.add(light);

const gold=new THREE.PointLight(0xffbb44,30,15);
gold.position.set(-4,2,3);
scene.add(gold);

const floor=new THREE.Mesh(
 new THREE.CircleGeometry(5,64),
 new THREE.MeshStandardMaterial({color:'#102c4b',metalness:.4,roughness:.7})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-2;
scene.add(floor);

const robot=new THREE.Group();
scene.add(robot);

function part(geometry,color,x,y,z){
 const mesh=new THREE.Mesh(geometry,
 new THREE.MeshStandardMaterial({color,metalness:.35,roughness:.35}));
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 robot.add(mesh);
 return mesh;
}

const body=part(new THREE.BoxGeometry(1.35,1.45,.8),'#087fe5',0,-.45,0);
const head=part(new THREE.SphereGeometry(.72,32,32),'#b7eaff',0,.85,0);

part(new THREE.BoxGeometry(.18,.18,.12),'#00eaff',-.27,.9,.63);
part(new THREE.BoxGeometry(.18,.18,.12),'#00eaff',.27,.9,.63);

part(new THREE.CylinderGeometry(.13,.13,.65,20),'#ffbb33',-.9,-.5,0).rotation.z=-.5;
part(new THREE.CylinderGeometry(.13,.13,.65,20),'#ffbb33',.9,-.5,0).rotation.z=.5;

part(new THREE.BoxGeometry(.4,.6,.4),'#ffbb33',-.35,-1.45,0);
part(new THREE.BoxGeometry(.4,.6,.4),'#ffbb33',.35,-1.45,0);

const ring=new THREE.Mesh(
 new THREE.TorusGeometry(2.1,.025,12,100),
 new THREE.MeshBasicMaterial({color:'#00cfff'})
);
ring.position.y=-1.7;
ring.rotation.x=Math.PI/2;
scene.add(ring);

const stars=[];
for(let i=0;i<100;i++){
 const s=new THREE.Mesh(
 new THREE.SphereGeometry(.025,8,8),
 new THREE.MeshBasicMaterial({color:'#56caff'})
 );
 s.position.set((Math.random()-.5)*12,
 (Math.random()-.5)*10,
 -Math.random()*8);
 scene.add(s);
 stars.push(s);
}

const aiCaps=[
'क्या आप जानते हैं AI कैसे काम करता है?',
'AI सबसे पहले डेटा को समझता है।',
'फिर यह डेटा के बीच कनेक्शन खोजता है।',
'Neural Network से AI सीखता है।',
'और फिर आपके सवालों का जवाब देता है!'
];

/* ===================== BOARD EXAM DOCUMENTARY ===================== */
const $=s=>document.querySelector(s);
const SK=['#f1c7a0','#d9a06f','#b97c4f','#8d5a3b'];
const E=u=>u*u*(3-2*u), lerp=(a,b,u)=>a+(b-a)*u, lv=(a,b,u)=>a.map((v,i)=>lerp(v,b[i],u));
const dl=(a,b,la,lb)=>u=>[lv(a,b,u),lv(la,lb,u)];
const MC={};
const mat=(c,o={})=>{const k=c+JSON.stringify(o);return MC[k]||(MC[k]=new THREE.MeshStandardMaterial({color:c,roughness:.6,metalness:.1,...o}))};
const put=(g,m,x=0,y=0,z=0)=>{m.position.set(x,y,z);g.add(m);return m};
const box=(g,w,h,d,c,x,y,z,o)=>put(g,new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c,o)),x,y,z);
const cyl=(g,rt,rb,h,c,x,y,z,o)=>put(g,new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,24),mat(c,o)),x,y,z);
const sph=(g,r,c,x,y,z,o)=>put(g,new THREE.Mesh(new THREE.SphereGeometry(r,24,16),mat(c,o)),x,y,z);
const glow=(c,i=1.6)=>({emissive:c,emissiveIntensity:i});
const GLASS={transparent:true,opacity:.18,roughness:.1};

function label(txt,col,size=1){
 const c=document.createElement('canvas');c.width=c.height=128;
 const x=c.getContext('2d');x.font='bold 100px Arial';x.textAlign='center';x.textBaseline='middle';
 x.fillStyle=col;x.shadowColor=col;x.shadowBlur=18;x.fillText(txt,64,70);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
 s.scale.set(size,size,1);return s;
}
function mkPts(n,w,h,d,col,size){
 const a=new Float32Array(n*3);
 for(let i=0;i<n;i++){a[i*3]=(Math.random()-.5)*w;a[i*3+1]=Math.random()*h;a[i*3+2]=(Math.random()-.5)*d}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(a,3));
 const p=new THREE.Points(geo,new THREE.PointsMaterial({color:col,size,transparent:true,opacity:.9,depthWrite:false}));
 p.userData={a,n,h};return p;
}
function movePts(p,speed,t){
 const {a,n,h}=p.userData;
 for(let i=0;i<n;i++){const k=i*3+1;a[k]=((a[k]+speed*.016)%h+h)%h}
 p.geometry.attributes.position.needsUpdate=true;
}
function person(shirt,skin,o={}){
 const g=new THREE.Group(),p=new THREE.Group();g.add(p);
 const base=o.seated?.55:.72, pant='#2b3445';
 if(o.seated){
  [-.12,.12].forEach(x=>{box(p,.16,.16,.5,pant,x,base-.08,.24);box(p,.16,.5,.16,pant,x,.27,.48)});
 }else{
  [-.12,.12].forEach(x=>box(p,.16,base,.16,pant,x,base/2,0));
 }
 const tor=new THREE.Mesh(new THREE.CylinderGeometry(.24,.28,.72,20),mat(shirt));put(p,tor,0,base+.36,0);
 const head=new THREE.Group();put(p,head,0,base+.9,0);
 sph(head,.22,skin,0,0,0);
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.235,20,12,0,Math.PI*2,0,Math.PI*.55),mat(o.hair||'#1a1410'));put(head,hair,0,.02,-.01);
 sph(head,.03,'#111',-.08,.02,.2);sph(head,.03,'#111',.08,.02,.2);
 const arms=[-1,1].map(s=>{
  const a=new THREE.Group();put(p,a,s*.33,base+.66,0);
  cyl(a,.07,.07,.6,shirt,0,-.3,0);sph(a,.075,skin,0,-.63,0);return a;
 });
 g.arms=arms;g.head=head;g.torso=tor;return g;
}
function chair(g,x,y,z,ry){
 const c=new THREE.Group();c.position.set(x,y,z);c.rotation.y=ry;
 box(c,.5,.06,.5,'#3b2f2a',0,.52,.12);box(c,.5,.55,.06,'#3b2f2a',0,.8,-.14);g.add(c);
}
function paperTex(){
 const c=document.createElement('canvas');c.width=512;c.height=724;const x=c.getContext('2d');
 x.fillStyle='#fbfbf6';x.fillRect(0,0,512,724);
 x.fillStyle='#1b3a6b';x.fillRect(0,0,512,92);
 x.fillStyle='#fff';x.textAlign='center';x.font='bold 40px "Noto Sans Devanagari",Arial';x.fillText('नमूना प्रश्न पत्र',256,52);
 x.font='20px "Noto Sans Devanagari",Arial';x.fillText('(काल्पनिक • केवल उदाहरण)',256,80);
 x.fillStyle='#223';x.textAlign='left';x.font='bold 24px Arial';
 for(let i=0;i<9;i++){
  const y=140+i*64;x.fillText((i+1)+'.',34,y);
  x.fillStyle='#b9bfcc';x.fillRect(74,y-18,300+((i*53)%120),10);x.fillRect(74,y,200+((i*37)%180),10);x.fillStyle='#223';
 }
 x.strokeStyle='#223';x.strokeRect(410,110,70,34);
 const t=new THREE.CanvasTexture(c);return t;
}
const T=Math.PI;
/* ---- scene builders: each returns {g,upd(u,t),cam(u)} ---- */
function s1(){
 const g=new THREE.Group();
 cyl(g,5,5,.1,'#0a1426',0,-1.7,0,{metalness:.8,roughness:.25});
 const ring=new THREE.Mesh(new THREE.TorusGeometry(2.4,.04,12,80),new THREE.MeshBasicMaterial({color:'#ffcc55'}));ring.rotation.x=T/2;put(g,ring,0,-1.6,0);
 const P=new THREE.Group();g.add(P);
 box(P,2.2,3.1,.04,'#fbfbf6');
 const pl=new THREE.Mesh(new THREE.PlaneGeometry(2.14,3.02),new THREE.MeshBasicMaterial({map:paperTex()}));pl.position.z=.025;P.add(pl);
 const qs=[];for(let i=0;i<8;i++){const s=label(i%2?'?':'✦',i%2?'#ffcc55':'#59d9ff',.9);g.add(s);qs.push(s)}
 const pts=mkPts(140,9,6,6,'#9fdcff',.05);pts.position.y=-2;g.add(pts);
 return{g,
  upd(u,t){P.rotation.y=Math.sin(t*.6)*.45+u*.5;P.position.y=Math.sin(t*1.5)*.1+.1;ring.rotation.z=t*.4;
   qs.forEach((s,i)=>{const a=t*.8+i*T/4;s.position.set(Math.cos(a)*2.5,Math.sin(t*1.2+i)*.9+.2,Math.sin(a)*2.5)});movePts(pts,.5,t)},
  cam:dl([0,.5,9.5],[0,.1,5.4],[0,0,0],[0,0,0])};
}
function s2(){
 const g=new THREE.Group();
 box(g,16,.1,16,'#4a3a2a',0,-.05,0);cyl(g,3.4,3.4,.03,'#2a4a7a',0,.02,0);
 cyl(g,1.5,1.5,.1,'#7a5230',0,.78,0);cyl(g,.2,.2,.78,'#4d3320',0,.39,0);
 const ts=[],cols=['#d96b4f','#4f8bd9','#58b368'];
 for(let i=0;i<3;i++){
  const a=i*2.094+.3,r=2.1,x=Math.sin(a)*r,z=Math.cos(a)*r;
  const p=person(cols[i],SK[i],{seated:true});p.position.set(x,0,z);p.rotation.y=a+T;g.add(p);ts.push(p);
  chair(g,x,0,z,a+T);
  box(g,.5,.012,.7,'#ffffff',Math.sin(a)*1.0,.84,Math.cos(a)*1.0).rotation.y=a;
 }
 box(g,10,4,.3,'#2c2118',0,2,-6);
 for(let i=0;i<14;i++)box(g,.5,.7+(i%3)*.15,.25,['#c0392b','#2980b9','#f1c40f','#27ae60','#8e44ad'][i%5],-4.5+i*.68,1.2+(i%2)*1.4,-5.8);
 box(g,4,2,.06,'#e9eef5',4.2,2.4,-5.7);
 for(let i=0;i<4;i++)box(g,2.8-i*.3,.08,.02,'#4f8bd9',4.2,3+(-i*.4)+.2,-5.66);
 cyl(g,.02,.02,1.6,'#222',0,3.4,0);cyl(g,.12,.5,.35,'#ffcc66',0,2.5,0,glow('#ffcc66',1.2));
 const sp=[];for(let i=0;i<6;i++){const s=label(i<3?'?':'✓',i<3?'#ffcc55':'#58e08a',.8);g.add(s);sp.push(s)}
 return{g,
  upd(u,t){ts.forEach((p,i)=>{p.arms[1].rotation.x=-1.1+Math.sin(t*6+i*2)*.15;p.arms[0].rotation.x=-.5;p.head.rotation.x=.25+Math.sin(t*1.5+i)*.05});
   sp.forEach((s,i)=>{const f=(t*.35+i*.17)%1,a=i*1.05;s.position.set(Math.sin(a)*1.1,1.3+f*1.8,Math.cos(a)*1.1);s.material.opacity=Math.sin(f*T)})},
  cam:u=>{const a=-.5+u*1.4,r=8-u*1.8;return[[Math.sin(a)*r,2.8-u*.5,Math.cos(a)*r],[0,1.2,0]]}};
}
function s3(){
 const g=new THREE.Group();
 box(g,18,.1,16,'#2d3138',0,-.05,0);
 for(let i=0;i<9;i++)box(g,.25,.012,16,'#e6b800',-8+i*2,.01,0);
 box(g,18,6,.3,'#3a4250',0,3,-5);
 box(g,6,1.6,1.8,'#46586e',0,.9,-1.5);box(g,5.4,.6,1.4,'#2f3d52',0,2.2,-1.5);
 const rl=[];for(let i=0;i<5;i++){const R=new THREE.Group();R.rotation.x=T/2;put(g,R,-2+i,1.9,-.55);const c=cyl(R,.18,.18,1.2,'#9aa7b8',0,0,0,{metalness:.9,roughness:.3});rl.push(c)}
 box(g,6.6,.14,1.2,'#1c1f24',0,.75,.6);
 const sheets=[];for(let i=0;i<10;i++)sheets.push(box(g,.5,.03,.7,'#ffffff',0,.86,.6));
 for(let i=0;i<4;i++)box(g,.7,.25,.9,'#a97c50',4.4,.13+i*.26,1.4);
 for(let i=0;i<4;i++)box(g,.72,.05,.92,'#c0392b',4.4,.2+i*.26,1.4);
 const bm=new THREE.MeshStandardMaterial({color:'#ff2d2d',emissive:'#ff2d2d',emissiveIntensity:2});
 cyl(g,.05,.05,2.5,'#555',-5.5,1.25,-3.8);put(g,new THREE.Mesh(new THREE.SphereGeometry(.25,20,16),bm),-5.5,2.7,-3.8);
 [[-7,4.5,-4.6],[7,4.5,-4.6]].forEach(([x,y,z])=>{cyl(g,.04,.04,.6,'#888',x,y+.3,z);put(g,new THREE.Mesh(new THREE.SphereGeometry(.22,16,8,0,T*2,0,T/2),mat('#1b1b1b')),x,y,z).rotation.x=T})
 box(g,.1,3,5,'#7fd6ff',-8.4,1.5,-1,GLASS);box(g,.1,3,5,'#7fd6ff',8.4,1.5,-1,GLASS);
 const gate=new THREE.Group();put(g,gate,-5.6,1,3);box(gate,2.4,.14,.14,'#e8e8e8',1.2,0,0);box(gate,.3,.14,.15,'#d22',.5,0,0);box(gate,.3,.14,.15,'#d22',1.6,0,0);box(g,.3,1.1,.3,'#444',-5.6,.55,3);
 const guard=person('#1f3a6b',SK[1],{hair:'#111'});guard.position.set(4,0,3);guard.rotation.y=-T/2-.4;g.add(guard);
 return{g,
  upd(u,t){rl.forEach(c=>c.rotation.y=t*4);sheets.forEach((s,i)=>s.position.x=-3+((t*1.1+i*.62)%6.2));
   bm.emissiveIntensity=1.2+Math.sin(t*6)*1.1;gate.rotation.z=u>.5?Math.min(1.2,(u-.5)*3):0;guard.arms[0].rotation.x=-.2+Math.sin(t*1.2)*.04},
  cam:dl([-6.5,2.2,7.5],[4.5,1.7,6.5],[-3,1.3,0],[3,1.3,-1.5])};
}
function s4(){
 const g=new THREE.Group();
 box(g,60,.1,7,'#1b1e24',0,-.05,0);box(g,60,.2,3,'#3a3f48',0,.05,-5.2);box(g,60,.2,3,'#3a3f48',0,.05,5.2);
 const dash=[];for(let i=0;i<12;i++)dash.push(box(g,1.4,.012,.14,'#e8e8e8',0,.01,0));
 const bl=[];for(let i=0;i<16;i++){const h=3+(i*7%5)*1.5,s=i%2?1:-1;const b=box(g,2.2,h,2.2,['#1d2a44','#26334d','#2d2a3f'][i%3],0,h/2,s*8.5);box(b,1.6,.2,.02,'#ffd27a',0,0,s*1.12,glow('#ffd27a',1.4)).position.y=h/2-1.2+(i%3)*.4;bl.push(b)}
 const van=new THREE.Group();g.add(van);
 box(van,3.4,1.6,1.6,'#e8edf2',0,1.3,0);box(van,1.2,1.15,1.5,'#dfe6ee',2.3,1.0,0);box(van,.05,.6,1.3,'#223',2.93,1.2,0,{metalness:.8,roughness:.1});
 box(van,3.42,.18,1.62,'#c0392b',0,1.3,0);box(van,3.42,.08,1.62,'#1b5fa8',0,.8,0);
 const wh=[];[[-1.1,.4,.85],[1.2,.4,.85],[-1.1,.4,-.85],[1.2,.4,-.85],[2.5,.4,.8],[2.5,.4,-.8]].forEach(([x,y,z])=>{const w=cyl(van,.4,.4,.2,'#111',x,y,z);w.rotation.x=T/2;wh.push(w)});
 const esc=new THREE.Group();esc.position.set(-6.5,0,.2);g.add(esc);
 box(esc,2.8,.7,1.4,'#1b5fa8',0,.6,0);box(esc,1.5,.55,1.3,'#9fc3ea',-.1,1.2,0);
 [[-.9,.3,.7],[.9,.3,.7],[-.9,.3,-.7],[.9,.3,-.7]].forEach(([x,y,z])=>{const w=cyl(esc,.3,.3,.18,'#111',x,y,z);w.rotation.x=T/2;wh.push(w)});
 box(esc,.2,.1,.5,'#ff3b3b',0,1.5,0,glow('#ff3b3b',2.5));
 const pk=new THREE.Group();g.add(pk);for(let i=0;i<3;i++){box(pk,.8,.5,.6,'#a97c50',0,.25+i*.5,0);box(pk,.82,.1,.62,'#c0392b',0,.25+i*.5,0)}
 sph(g,2.2,'#cfe6ff',-20,16,-30,{...glow('#cfe6ff',1)});
 return{g,
  upd(u,t){dash.forEach((d,i)=>d.position.x=((i*5-t*9)%60+60)%60-30);bl.forEach((b,i)=>b.position.x=((i*4.2-t*5)%67+67)%67-33);
   wh.forEach(w=>w.rotation.y=t*9);van.position.y=Math.sin(t*9)*.015;esc.position.y=Math.sin(t*8+1)*.015;
   const k=Math.min(1,Math.max(0,(u-.05)/.2));pk.position.set(lerp(-5,-2.2,k),0,0);pk.visible=u<.28;pk.position.z=lerp(2.2,0,k)},
  cam:dl([-2.5,1.3,5.2],[7,2.2,9],[-3,.9,1.4],[0,1.3,0])};
}
function s5(){
 const g=new THREE.Group();
 box(g,14,.1,14,'#33363c',0,-.05,0);box(g,14,7,.3,'#4a4f58',0,3.5,-5.2);box(g,.3,7,14,'#454a53',-7,3.5,0);box(g,.3,7,14,'#454a53',7,3.5,0);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(2.0,.28,16,48),mat('#2b2f36',{metalness:.9,roughness:.35}));put(g,ring,0,2.4,-4.5);
 const door=new THREE.Group();put(g,door,0,2.4,-4.3);
 const dc=cyl(door,1.9,1.9,.3,'#7a8594',0,0,0,{metalness:.9,roughness:.3});dc.rotation.x=T/2;

 renderer.setPixelRatio(1);renderer.setSize(1080,1920,false);
 if(mode==='exam'){elapsed=0;start=performance.now();playing=true}
 const mt=['video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
 recorder=new MediaRecorder(rc.captureStream(30),{...(mt?{mimeType:mt}:{}),videoBitsPerSecond:8e6});
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 recorder.onstop=()=>{
  fitRenderer();
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));
  a.download=mode==='exam'?'board-exam-question-paper-reel.webm':'hindi-3d-demo.webm';a.click();
  $('#record').textContent='● Record';statusEl.textContent='Recording saved';
 };
 recorder.start();
 $('#record').textContent='■ Stop';statusEl.textContent='Recording 1080×1920 @30fps...';
};

window.addEventListener('resize',()=>{
 if(recorder?.state==='recording')return;
 camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();
 renderer.setSize(stage.clientWidth,stage.clientHeight);
});
setMode('exam');
</script>
</body>
